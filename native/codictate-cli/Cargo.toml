[package]
name = "codictate-cli"
version = "0.1.0"
edition = "2024"
publish = false
description = "The `codictate` command line: a thin client of the running Codictate app (docs/CLI.md)."

[[bin]]
name = "codictate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
serde_json = "1.0"
tokio = { version = "1.53", default-features = false, features = ["rt", "net", "io-util", "time", "signal", "sync", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WindowsProgramming",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
