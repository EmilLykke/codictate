[package]
name = "codictate-windows-helper"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
cpal = "0.16.0"
crossbeam-channel = "0.5.15"
hound = "3.5.1"
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

# Windows: the Supported Platform build. Keep these exactly as they were
# before the Linux backend existed.
[target.'cfg(windows)'.dependencies]
arboard = "3.6.1"
parakeet-rs = { version = "0.3.5", features = ["directml"] }
windows = { version = "0.54.0", features = [
  "Win32_Devices_FunctionDiscovery",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }
windows-sys = { version = "0.60.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
] }

# Linux (Preview Platform, Hyprland only): Wayland clipboard through the
# data-control protocol, CPU-only ONNX Parakeet, and signal handling so
# `record` and `keyboard-hook` shut down cleanly on SIGINT / SIGTERM.
[target.'cfg(not(windows))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
parakeet-rs = "0.3.5"
signal-hook = "0.3.18"

[[bin]]
name = "CodictateWindowsHelper"
path = "src/main.rs"
