name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ── Create a draft release so build jobs can upload to it ─────────────────────
  create-release:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.detect.outputs.channel }}
      mac_exists: ${{ steps.check-mac.outputs.mac_exists }}

    steps:
      - name: Checkout (for tag annotation)
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Detect channel and release notes from tag
        id: detect
        run: |
          if [[ "${{ github.ref_name }}" == *"-canary"* ]]; then
            echo "channel=canary" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
          # Use the git tag annotation message as release notes if set
          TAG_MSG=$(git tag -l --format='%(contents:subject)' "${{ github.ref_name }}")
          if [[ -n "$TAG_MSG" && "$TAG_MSG" != "release: ${{ github.ref_name }}" ]]; then
            echo "notes=${TAG_MSG}" >> "$GITHUB_OUTPUT"
          else
            echo "notes=Codictate ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft release (skip if already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          CHANNEL="${{ steps.detect.outputs.channel }}"
          NOTES="${{ steps.detect.outputs.notes }}"
          # Existence is checked against the list endpoint, which returns drafts, rather
          # than `gh release view <tag>`, which resolves through /releases/tags/<tag> and
          # therefore cannot see a draft. Crucially the API error is no longer swallowed:
          # previously a transient 503 read as "no such release" and fell through to
          # `gh release create`, attempting a duplicate. A failed query now fails the job.
          if ! EXISTING=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
                --jq ".[] | select(.tag_name == \"$TAG\") | .id"); then
            echo "Could not query releases for ${{ github.repository }}." >&2
            echo "Treating this as an error rather than assuming $TAG does not exist." >&2
            exit 1
          fi
          if [ -n "$EXISTING" ]; then
            echo "Release already exists: $TAG (id $(echo "$EXISTING" | head -1))"
          elif [ "$CHANNEL" = "canary" ]; then
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "$NOTES" \
              --prerelease \
              --draft \
              --verify-tag
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --notes "$NOTES" \
              --draft \
              --verify-tag
          fi

      - name: Check for existing macOS artifacts
        id: check-mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          CHANNEL="${{ steps.detect.outputs.channel }}"
          # Resolved by id for the same reason as above: a draft is invisible to a tag
          # lookup, so the old check reported "no macOS artifacts" for a draft that
          # already had them, and would have rebuilt macOS needlessly.
          REL_ID=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -1)
          ASSETS=""
          if [ -n "$REL_ID" ]; then
            ASSETS=$(gh api "repos/${{ github.repository }}/releases/$REL_ID/assets?per_page=100" \
              --jq ".[].name")
          fi
          # Skipping the build is only safe on a positive match. Anything else (no
          # release, no assets, empty answer) must fall through to building.
          if echo "$ASSETS" | grep -q "^${CHANNEL}-.*macos"; then
            echo "mac_exists=true" >> "$GITHUB_OUTPUT"
            echo "macOS artifacts already uploaded - CI will skip macOS build."
          else
            echo "mac_exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── macOS build ───────────────────────────────────────────────────────────────
  build-macos:
    needs: create-release
    if: needs.create-release.outputs.mac_exists != 'true'
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache vendor binaries and model
        uses: actions/cache@v4
        with:
          path: vendors/
          key: macos-vendors-${{ hashFiles('scripts/pre-build.ts') }}

      - name: Pre-build (download and compile vendor binaries)
        run: bun run scripts/pre-build.ts

      - name: Install Apple certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          security delete-keychain build.keychain || true
          echo $MACOS_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P $MACOS_CERTIFICATE_PWD -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          echo "Available signing identities:"
          security find-identity -v -p codesigning build.keychain
          rm certificate.p12

      - name: Build (${{ needs.create-release.outputs.channel }})
        env:
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID || '' }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID || '' }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID || '' }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS || '' }}
        run: |
          echo "::add-mask::$ELECTROBUN_DEVELOPER_ID"
          echo "::add-mask::$ELECTROBUN_APPLEID"
          echo "::add-mask::$ELECTROBUN_APPLEIDPASS"
          echo "::add-mask::$ELECTROBUN_TEAMID"
          bun run build:${{ needs.create-release.outputs.channel }}

      # Persisted before the upload, so a failed upload costs a re-download rather than
      # a full rebuild. This is what made the v0.0.54 Windows failure expensive: the
      # binaries only ever existed on the runner, so each retry rebuilt from scratch.
      - name: Persist build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.create-release.outputs.channel }}-macos-arm64
          path: artifacts/${{ needs.create-release.outputs.channel }}-*
          retention-days: 7
          if-no-files-found: error

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/upload-release-assets.sh \
            "${{ github.ref_name }}" \
            "artifacts/${{ needs.create-release.outputs.channel }}-"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # ── Windows build ─────────────────────────────────────────────────────────────
  build-windows:
    needs: create-release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Provides glslc, needed only by the llama-completion cmake source-build fallback in
      # scripts/pre-build.ts. On this x64 runner that fallback does not fire (the pinned
      # prebuilt Vulkan archive is used instead), so the step is a safety net for a
      # non-x64 Windows host rather than a requirement of the current build.
      - name: Install Vulkan SDK (glslc, for the llama-completion source-build fallback)
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: false
          cache: true

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache vendor binaries and model
        uses: actions/cache@v4
        with:
          path: vendors/
          key: windows-x64-vendors-${{ hashFiles('scripts/pre-build.ts') }}

      - name: Pre-build (download and compile vendor binaries)
        run: bun run scripts/pre-build.ts

      - name: Build Windows native helper (Rust/Cargo)
        run: bun run build:native:windows-helper

      - name: Build (${{ needs.create-release.outputs.channel }})
        shell: pwsh
        env:
          CODICTATE_CHANNEL: ${{ needs.create-release.outputs.channel }}
        run: |
          bunx vite build
          bunx electrobun build --env=${{ needs.create-release.outputs.channel }}

      - name: Build Windows installer (${{ needs.create-release.outputs.channel }})
        shell: pwsh
        env:
          CODICTATE_CHANNEL: ${{ needs.create-release.outputs.channel }}
        run: .\scripts\build-inno-installer.ps1 -Channel ${{ needs.create-release.outputs.channel }}

      # See the macOS job: persisting first means a failed upload is cheap to retry.
      - name: Persist build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.create-release.outputs.channel }}-windows-x64
          path: artifacts/${{ needs.create-release.outputs.channel }}-*
          retention-days: 7
          if-no-files-found: error

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          bash scripts/upload-release-assets.sh \
            "${{ github.ref_name }}" \
            "artifacts/${{ needs.create-release.outputs.channel }}-"

  # ── Publish once both builds are done ─────────────────────────────────────────
  publish:
    needs: [build-macos, build-windows]
    if: |
      always() &&
      needs.build-windows.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --repo "${{ github.repository }}" --draft=false

  # ── Update Homebrew tap ──────────────────────────────────────────────────────
  update-homebrew:
    needs: publish
    if: ${{ !contains(github.ref_name, 'canary') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@v4
        with:
          repository: EmilLykke/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Update cask version and SHA256
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG_URL="https://github.com/EmilLykke/codictate/releases/download/${GITHUB_REF_NAME}/stable-macos-arm64-Codictate.dmg"
          SHA256=$(curl -sL "$DMG_URL" | shasum -a 256 | cut -d' ' -f1)

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/codictate.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA256}\"/" Casks/codictate.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/codictate.rb
          git diff --cached --quiet || (git commit -m "codictate ${GITHUB_REF_NAME}" && git push)
